spring.application.name=escape-room-clara-backend

# Core
spring.profiles.active=postgres

# API endpoints
api-endpoint=api/v1

# CORS allowed origin
cors.allowed-origin=http://localhost:5173

# Docker
spring.docker.compose.enabled=true

# JWT signing key
jwt.key=${JWT_SECRET_KEY}

# Token expiration
jwt.access-token.expiration-hours=1
jwt.refresh-token.expiration-days=365

# reCAPTCHA secret key
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
